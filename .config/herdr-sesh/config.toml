# herdr-plugin-sesh, ported from ~/.config/sesh/sesh.toml.
# sesh has no herdr backend yet (joshmedeski/sesh#460), so this stands in.
# Bound to prefix+s in ~/.config/herdr/config.toml.

version = 1

[list]
cache = true
# Same order as `sesh list -t -z -c`:
#   herdr = running workspaces, config = the list below, zoxide = frecency dirs.
source_order = ["herdr", "config", "zoxide", "dir"]

[naming]
# ~/dev/work/crewview shows as "crewview".
path_components = 1

[picker]
show_icons = true
show_path = true
show_preview = true
herdr_theme_inherit = true
show_last_workspace = true
# Float a blocked agent to the top.
workspace_sort = "agent"
prompt = "⚡  "
placeholder = "Search workspaces"

[workspace_defaults]
preview = "eza --icons=always --color=always -la {}"

# Were [[session]] in sesh.toml.
[[workspace]]
name = "dotfiles"
path = "~/.config"

[[workspace]]
name = "home"
path = "~"
