# herdr config, ported from ~/.config/tmux/tmux.conf.
#
#   herdr --default-config      print all defaults
#   herdr config check          validate this file
#   herdr server reload-config  apply to a running server (or prefix+shift+r)
#
# herdr writes session.json and plaintext scrollback into this directory.
# Track this file by path, never the directory. See .gitignore.

onboarding = false

[theme]
# tmux: status-style fg=default,bg=default. The `terminal` theme inherits the
# host palette, so Ghostty's Modus Operandi / Synthwave switch drives herdr too.
# herdr themes are global; there is no per-workspace theme key.
name = "terminal"

[terminal]
# tmux: splits carried -c "#{pane_current_path}".
new_cwd = "follow"
# tmux: allow-passthrough on. Inline images in Ghostty.
kitty_graphics = true

[update]
# Homebrew owns the version. manifest_check stays on; it feeds agent detection.
version_check = false
manifest_check = true

[session]
# Replays `claude --resume <id>` after a server restart. Replaces the tmux
# claude-pane-registry and resurrect-post-restore scripts.
# Requires `herdr integration install claude`, run by yadm bootstrap.
resume_agents_on_restore = true

[experimental]
# tmux: @resurrect-capture-pane-contents.
# Writes scrollback to session-history.json in plaintext.
# herdr#1156: a crash between the session and history writes can restore the
# wrong scrollback under a pane. Not yet fixed upstream.
pane_history = true

[ui]
# tmux: mouse on. No per-app wheel whitelist needed here; panes that request
# mouse reporting receive wheel events directly.
mouse_capture = true
mouse_scroll_lines = 3
copy_on_select = true
sidebar_width = 26

[keys]
# tmux: prefix was backtick. Press it twice to send a literal backtick.
prefix = "`"

# Workspaces are the old tmux sessions, one per Ghostty tab.
# A direct chord, so Ghostty can forward cmd+1..9 to it. See ghostty/config.ghostty.
switch_workspace = "ctrl+shift+1..9"
# herdr rejects the name `bracketleft`; the literal characters work.
previous_workspace = "prefix+["
next_workspace = "prefix+]"

# Tabs are the old tmux windows. prefix+1..9, prefix+n and prefix+p keep their
# tmux meanings, which is why workspaces use a different chord.

# Frees prefix+s for the sesh picker, as in tmux.conf.
# A plain key, not alt: `herdr config check` validates syntax, not delivery.
settings = "prefix+comma"

# tmux: bind-key "L" run-shell "sesh last"
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "Jump to the previous workspace"

# tmux: the fzf-tmux sesh picker on prefix+s.
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "sesh workspace picker"

# tmux: wfxr/tmux-fzf-url.
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "fzf-url"
description = "fzf open URL from pane"

# prefix+g is herdr's goto picker, so lazygit takes ctrl+g.
[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
