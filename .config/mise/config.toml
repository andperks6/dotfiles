# Previously migrated from ~/.tool-versions (asdf)
# See: https://mise.jdx.dev/configuration.html

[tools]
bun = "1.3"
dotnet = "10"
golang = "1.25"
gradle = "9.2"
java = "temurin-21"
"github:JetBrains/kotlin" = "2.2"
k9s = "0.50"
kubectl = "1.34"
lua = "5.1"
nodejs = "22.21"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:puppeteer" = "latest"
"npm:pyright" = "latest"

opentofu = "1.11"
python = "3.14"
ruby = "3.2.2"
rust = "1.91"
scala = "3.4.1"
terraform = "1.14"
uv = "0.9"
zig = "0.15"
zls = "0.15"

[settings]
# Automatically install tools when entering a directory with a config file
auto_install = true
# https://mise.jdx.dev/mise-cookbook/python.html#mise-uv
python.uv_venv_auto = true