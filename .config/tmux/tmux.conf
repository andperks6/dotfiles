# Change Default Prefix
unbind C-b
set -g prefix `

# Allows us to still type the prefix when clicked twice in a row
bind-key ` send-prefix

# Use tmux instead of screen to fix italics
set -g default-terminal "tmux-256color"

# Enable VIM like buffer scrolling
set -g mode-keys vi

# Increase history buffer
set -g history-limit 50000

# Enable mouse
set -g mouse on

# Mouse wheel behavior, per foreground app:
#   - Whitelisted TUIs (lazygit, vim, less, man): wheel → Up/Down keys
#     so the app scrolls its content. Needed because tmux+alt-screen
#     would otherwise enter copy-mode and lazygit never sees the event.
#   - Everything else (shell, claude, etc.): wheel-up enters tmux
#     copy-mode for transcript scrollback; wheel-down is a no-op unless
#     already in copy-mode (tmux handles it natively there).
# Extend the whitelist with more names as needed; check `pane_current_command`.
bind-key -T root WheelUpPane \
  if-shell -Ft= '#{m/r:^(lazygit|n?vim|less|man)$,#{pane_current_command}}' \
    'send-keys Up' \
    'if-shell -Ft= "#{pane_in_mode}" "send-keys -M" "copy-mode -e"'
bind-key -T root WheelDownPane \
  if-shell -Ft= '#{m/r:^(lazygit|n?vim|less|man)$,#{pane_current_command}}' \
    'send-keys Down' \
    'send-keys -M'

# Do not detach tmux when session is killed
set -g detach-on-destroy off

# Allow pass through for images
set -g allow-passthrough on

# Configure clipboard
# Use OSC 52 for modern terminals (Kitty, Alacritty, Wezterm)
# This works over SSH and is the cleanest approach for tmux 3.2+
#set -s set-clipboard on

# Vi-mode: v to start selection, y to yank (uses OSC 52 automatically)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Use r to reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config"

# Sesh integration - use lowercase 's' for session picker
bind-key "s" run-shell "sesh connect \"$(
	sesh list | fzf-tmux -p 55%,60% \
		--no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
		--header '  ^a all ^t tmux ^x zoxide ^d tmux kill ^f find' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
		--bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
		--bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
		--bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""

# Override last-session to use sesh
bind-key "L" run-shell "sesh last"

# Make all splits start in current directory
bind C   new          -c "#{pane_current_path}" -A -s "#{b:pane_current_path}"
bind c   new-window   -c "#{pane_current_path}" -a
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -c "#{pane_current_path}" -h

# Neovim suggestions
set -g escape-time 10
set -g focus-events on
set -sa terminal-features ",*:RGB"

# Status line configuration
set -g status on
set -g automatic-rename on
set -g status-interval 5

# Inherit the terminal's default fg/bg so the bar follows Ghostty's
# light/dark theme automatically (no OS-appearance detection needed).
set -g status-style fg=default,bg=default
# Reverse video gives a high-contrast block from the terminal's own
# colors, so the active window reads well in both light and dark.
set -g window-status-current-style reverse,bold

set -g automatic-rename-format "#{b:pane_current_path}"
set -g status-left "#S "
set -g status-justify left
set -g status-right "%a %Y-%m-%d %H:%M"

set -g status-left-length 100
set -g status-left-style default
set -g status-right-length 100
set -g status-right-style default

# ---- Plugins (TPM) ---- #
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'  # Restore nvim sessions

# Continuum settings
set -g @continuum-restore 'on'             # Auto-restore on tmux start
set -g @continuum-save-interval '5'        # Save every 5 minutes (was 15; a
                                           # 2026-07-27 crash lost 13 min of state)

# Keep each pane_contents.tar.gz paired with its layout snapshot, so a
# post-crash auto-save cannot destroy pre-crash scrollback.
set -g @resurrect-hook-post-save-all 'bash ~/.config/tmux/scripts/resurrect-post-save.sh'

# Block until every pane has read its saved scrollback before resurrect deletes
# the content files. Without this, resurrect's unsynchronised cleanup races the
# asynchronous per-pane `cat` and most panes restore blank.
set -g @resurrect-hook-pre-restore-pane-processes 'bash ~/.config/tmux/scripts/resurrect-pre-restore-processes.sh'

# Re-offer `claude --resume` in panes that were running Claude. Resurrect never
# restores claude itself (not in @resurrect-default-processes) and the profile
# cannot be inferred from cwd, so the pane->session map is recorded by a Claude
# SessionStart hook. Commands are pre-typed, not run; opt in to auto-run with
#   set -g @tmux-claude-autorun 'on'
set -g @resurrect-hook-post-restore-all 'bash ~/.config/tmux/scripts/resurrect-post-restore.sh'

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
